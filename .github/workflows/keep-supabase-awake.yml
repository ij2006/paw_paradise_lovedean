# Supabase pauses free projects after a week with no database activity.
# This runs a tiny read every 3 days so that never happens.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 9 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Read from the database
        run: |
          URL=$(grep -oE "https://[a-z0-9]+\.supabase\.co" js/config.js | head -1)
          KEY=$(grep -E "SUPABASE_ANON_KEY *=" js/config.js | grep -oE "'[^']+'" | tr -d "'")
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "$URL/rest/v1/gallery_submissions?select=id&approved=eq.true&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Supabase replied $CODE"
          test "$CODE" = "200"
